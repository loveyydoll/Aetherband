name: .NET

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore desktop project
        run: dotnet restore apps/desktop/RouletteStudio.Desktop/RouletteStudio.Desktop.csproj
      - name: Build desktop project
        run: dotnet build apps/desktop/RouletteStudio.Desktop/RouletteStudio.Desktop.csproj --no-restore --configuration Debug
      - name: Test .NET test projects when present
        shell: bash
        run: |
          mapfile -t test_projects < <(find . -type f -name '*Tests.csproj' -not -path '*/bin/*' -not -path '*/obj/*' | sort)
          if (( ${#test_projects[@]} )); then
            for project in "${test_projects[@]}"; do
              dotnet test "$project" --configuration Debug
            done
          else
            echo "No *Tests.csproj projects found; no .NET test projects to run."
          fi
